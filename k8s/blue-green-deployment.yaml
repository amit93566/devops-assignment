apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  labels:
    strategy: blue-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest
      version: blue
  template:
    metadata:
      labels:
        app: aceest
        version: blue
    spec:
      containers:
      - name: aceest
        image: 2024tm93566bits/aceest_fitness_image:v1.0
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
  labels:
    strategy: blue-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest
      version: green
  template:
    metadata:
      labels:
        app: aceest
        version: green
    spec:
      containers:
      - name: aceest
        image: 2024tm93566bits/aceest_fitness_image:v2.0
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-service
spec:
  selector:
    app: aceest
    version: blue
  ports:
  - port: 80
    targetPort: 5000
  type: LoadBalancer
