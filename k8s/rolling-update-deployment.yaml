apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-rolling
  labels:
    strategy: rolling-update
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: aceest-rolling
  template:
    metadata:
      labels:
        app: aceest-rolling
    spec:
      containers:
      - name: aceest
        image: 2024tm93566bits/aceest_fitness_image:v1.0
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-rolling-service
spec:
  selector:
    app: aceest-rolling
  ports:
  - port: 80
    targetPort: 5000
  type: LoadBalancer
